<html lang="en">

<head>
    <title>Camera Editor</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1" />
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }

        body {
            background: radial-gradient(ellipse at 46% 42%, #3e5973, #26384d 55%, #162131);
        }

        #info {
            color: white;
            position: absolute;
            left: 10px;
            bottom: 10px;
            opacity: 0.8;
        }

        #output {
            white-space: pre;
            margin-bottom: 10px;
        }
    </style>
    <link rel="shortcut icon" href="#">
</head>

<body>
    <div id="info">
        <div id="output" role="status"></div>
    </div>

    <script type="module" src="./cameraEditor.js"></script>
</body>

</html>
